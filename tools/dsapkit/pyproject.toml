[project]
name = "dsapkit"
version = "0.1.0"
description = "Build tooling for iitjeekota.com: tokens, fonts, icons, logo, OG images, copy lint and the brand guide."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dsapkit = "dsapkit.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Security linting (CLAUDE.md section 5; tools pinned in tools/ci/requirements.txt, run by make security).
[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["S"]  # flake8-bandit: the security rules

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S314", "S603", "S607"]  # tests assert, parse their own XML and call ffprobe

[tool.bandit]
exclude_dirs = ["tests"]
# B404 and B603: importing subprocess and calling it with an argument list (no shell) are not findings; ruff S603 reviews each call.
# B406: xml.sax.saxutils.escape writes XML, it does not parse any.
skips = ["B404", "B406", "B603"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dsapkit = ["guide/*.css"]
