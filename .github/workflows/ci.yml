# CI (CLAUDE.md sections 4 and 5, plan D5 and D6). Every third-party action is pinned to a commit that is at least
# 14 days old (Renovate keeps them current), the token can only read, and nothing here deploys.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check and the browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Picture and video tools (rsvg-convert renders the brand images, ffmpeg reads the encoded film)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin fontconfig ffmpeg
      - run: make js-install
      - run: make check
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests, including the Content Security Policy run (apps/web/e2e/security.spec.ts)
        run: make e2e

  security:
    name: static security checks, secrets and the software bill of materials
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks reads the whole history
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: The pinned tools, installed only if every file matches its hash
        run: python -m pip install --require-hashes --no-deps -r tools/ci/requirements.txt
      - run: make js-install
      - name: ruff and bandit on the tooling, pnpm audit on what the site ships
        run: make security
      - name: The tools themselves are audited too
        run: python -m pip_audit --require-hashes --disable-pip -r tools/ci/requirements.txt
      - name: Gitleaks (the release's own checksum is pinned here)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 .
      - name: Software bill of materials (CycloneDX)
        run: pnpm sbom --sbom-format cyclonedx --out sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  osv:
    name: known vulnerabilities (OSV)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=pnpm-lock.yaml
        --lockfile=tools/ci/requirements.txt
      upload-sarif: false
      fail-on-vuln: true
