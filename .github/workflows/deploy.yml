# Build the site here and hand Cloudflare Pages the finished output (docs/setup/security.md, ADR 0009).
# Cloudflare's own Git build cannot run make brand and make media-encode (they need rsvg-convert and ffmpeg),
# so it never builds anything: it only receives apps/web/dist, with its _headers and _redirects files.
#
# A pull request from this repository gets a preview address (noindex). main goes to production only after
# someone approves the "production" environment (Settings, Environments). A pull request from a fork never
# receives the secrets, so it is built and checked but not deployed.
#
# One-time setup: create the Pages project (direct upload), then add CLOUDFLARE_API_TOKEN (a token that can only
# edit Cloudflare Pages) and CLOUDFLARE_ACCOUNT_ID as secrets of the "production" and "preview" environments.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_PROJECT: iitjeekota

jobs:
  build:
    name: build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin fontconfig ffmpeg
      - run: make js-install
      - name: Build (make web builds the brand files and the map first), then lint what was built (no inline code, nothing from another site, no hidden data in any file)
        run: make web
      - name: The built headers must be the strict ones
        run: |
          grep -q "Content-Security-Policy: default-src 'none'" apps/web/dist/_headers
          test -f apps/web/dist/.well-known/security.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: apps/web/dist
          if-no-files-found: error

  preview:
    name: preview address (pull requests from this repository)
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: preview
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=${{ github.head_ref }} --commit-dirty=true

  production:
    name: production (after approval)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main
